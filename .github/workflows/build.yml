name: Build
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - feat/*
      - fix/*
      - dependabot/*

jobs:
  build_on_linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@master
        with:
          node-version: 22
      - name: install yarn
        run: npm i -g yarn
      - name: install dependencies
        run: yarn install --immutable --immutable-cache --check-cache
      - name: build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: yarn run build

  build_on_mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@master
        with:
          node-version: 22
      - name: install yarn
        run: npm i -g yarn
      - name: install dependencies
        run: yarn install --immutable --immutable-cache --check-cache
      - name: build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: yarn run build

  build_on_win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@master
        with:
          node-version: 22
      - name: install yarn
        run: npm i -g yarn
      - name: install dependencies
        run: yarn install --immutable --immutable-cache --check-cache
      - name: build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: yarn run build
